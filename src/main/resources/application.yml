spring:
  application:
    name: pomodoro-bot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pomodoro_bot}
    username: ${DATABASE_USERNAME:pomodoro}
    password: ${DATABASE_PASSWORD:pomodoro}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

bot:
  discord:
    token: ${DISCORD_BOT_TOKEN}

pomodoro:
  scheduler:
    due-session-check-rate-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info
